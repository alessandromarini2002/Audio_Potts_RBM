# RBM_latent.py -- experiment config per WavTokenizer e Potts RBM
# Run: python RBM_latent.py config.yaml

NOTE: "audio first experiment with WavTokenizer"
EXPERIMENT_ID: "04"
LOG_PATH: "RUNS/RBM_WavTokenizer"
DATA_DIR: "DATA/archive/happy/"

# Percorsi per WavTokenizer (configurazione e pesi pre-addestrati)
WAVTOKENIZER_CONF_FILE: "WavTokenizer/configs/wavtokenizer_smalldata_frame40_3s_nq1_code4096_dim512_kmeans200_attn.yaml"
WAVTOKENIZER_CKPT_FILE: "WavTokenizer/ckpt/WavTokenizer_small_600_24k_4096.ckpt" 

# Vocabolario: WavTokenizer usa tipicamente un codebook di 4096 token discreti
VOCABULARY: "full" 
SEED: 42
N_HIDDEN: 512            # Riduciamo leggermente la capacità per evitare memorizzazione facile (da 1024)
N_EPOCHS: 100             # Diamo il tempo alla rete di completare il warmup e potare
LR: 0.0001              # Leggermente più basso per stabilizzare le oscillazioni
BATCH_SIZE: 16
K_TRAIN: 20              # Catena più corta per il training
PERSISTENT_CD: true
WEIGHT_DECAY: 0.0001       # Aumentiamo la regolarizzazione per contrastare l'overfitting visto sulla validazione
W_INIT: fixed
W_INIT_SCALE: 0.01
INIT_BIAS: true
PRUNE: false
PRUNE_WARMUP_EPOCHS: 5  # Facciamo partire il pruning prima, visto che 25 epoche erano troppe per un test rapido
PRUNE_END_EPOCH: 25
PRUNE_EVERY: 3
PRUNE_M_FINAL: 40        # Lasciamo un po' più di connessioni inizialmente
SAMPLING: cleanup
EVAL_GIBBS_STEPS: 100     # RIDOTTO DRASTICAMENTE da 300 per evitare il rumore acustico in generazione!
GENERATE_TB_PER_STEPS: 10