# RBM_latent.py -- experiment config per WavTokenizer e Potts RBM
# Run: python RBM_latent.py config.yaml

NOTE: "audio first experiment with WavTokenizer"
EXPERIMENT_ID: "012"
LOG_PATH: "RUNS/RBM_WavTokenizer"
DATA_DIR: "DATA/archive/happy/"

# Percorsi per WavTokenizer (configurazione e pesi pre-addestrati)
WAVTOKENIZER_CONF_FILE: "WavTokenizer/configs/wavtokenizer_smalldata_frame40_3s_nq1_code4096_dim512_kmeans200_attn.yaml"
WAVTOKENIZER_CKPT_FILE: "WavTokenizer/ckpt/WavTokenizer_small_600_24k_4096.ckpt" 

# Vocabolario e Riproducibilità
VOCABULARY: reduced
SEED: 42

# Architettura della RBM
N_HIDDEN: 64             
N_EPOCHS: 150

# Iperparametri di Ottimizzazione
LR: 0.0005             
BATCH_SIZE: 32
K_TRAIN: 5             
PERSISTENT_CD: true
WEIGHT_DECAY: 0.001

# Inizializzazione
W_INIT: xavier
W_INIT_SCALE: 0.01
INIT_BIAS: true

# Pruning (Potatura Graduale Cubica)
PRUNE: false
PRUNE_WARMUP_EPOCHS: 
PRUNE_END_EPOCH: 
PRUNE_EVERY: 
PRUNE_M_FINAL: 

# Generazione e Campionamento Audio
SAMPLING: full_gibbs
EVAL_GIBBS_STEPS: 500    
GENERATE_TB_PER_STEPS: 10