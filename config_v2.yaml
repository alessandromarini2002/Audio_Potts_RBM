# ConditionalRBM_latent_v1.py -- experiment config (WavTokenizer small 40 tok/s + Potts RBM)
# Run: python ConditionalRBM_latent_v1.py config_v2.yaml
# Run: Consiglio: nohup python ConditionalRBM_latent_v1.py config_v2.yaml > training.log 2>&1 &

NOTE: "v1: corrected version "
EXPERIMENT_ID: "v1_multiclass_004"
LOG_PATH: "RUNS/RBM_WavTokenizer"
DATA_DIR: "DATA/archive"

WAVTOKENIZER_CONF_FILE: "WavTokenizer/configs/wavtokenizer_smalldata_frame40_3s_nq1_code4096_dim512_kmeans200_attn.yaml"
WAVTOKENIZER_CKPT_FILE: "WavTokenizer/ckpt/WavTokenizer_small_600_24k_4096.ckpt"

VOCABULARY: reduced   
SEED: 42
N_HIDDEN: 1024
N_EPOCHS: 1200         
LR: 0.02                
BATCH_SIZE: 32
K_TRAIN: 8              
PERSISTENT_CD: true
WEIGHT_DECAY: 0.0001
W_INIT: fixed
W_INIT_SCALE: 0.01
INIT_BIAS: true
PRUNE: false            
PRUNE_WARMUP_EPOCHS: 5
PRUNE_END_EPOCH: 25
PRUNE_EVERY: 3
PRUNE_M_FINAL: 40
SAMPLING: cleanup
EVAL_GIBBS_STEPS: 100
GENERATE_TB_PER_STEPS: 4000  # number of audio samples per generation (fixed seeds)
GENERATE_EVERY: 400         # checkpoint + audio samples every N epochs (and at the last epoch)